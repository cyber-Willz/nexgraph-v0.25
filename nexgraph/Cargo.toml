[package]
name = "nexgraph"
version = "0.25.0"
edition = "2021"
rust-version = "1.85"
description = "Property-hypergraph database: file-WAL or PostgreSQL durability, MVCC time-travel, HNSW vector index, Cypher-style query language, spectral analytics, data analytics and cyber-security procedures, Power BI / BI table export"
license = "MIT"

[lib]
name = "nexgraph"
path = "src/lib.rs"

[[bin]]
name = "nexgraph"
path = "src/bin/nexgraph.rs"

[[example]]
name = "cora_real_data"
path = "examples/cora_real_data.rs"
required-features = ["nonbacktracking"]

[[bin]]
name = "nexgraph-server"
path = "src/bin/nexgraph-server.rs"
required-features = ["server"]

[[example]]
name = "bench_pg"
path = "examples/bench_pg.rs"
required-features = ["postgres"]

[[example]]
name = "import_connectome"
path = "examples/import_connectome.rs"
required-features = ["connectome"]

# The database core has no third-party dependencies. Spectral procedures reuse
# the spectral_hypergraph crate from the human_connectome_rnn tree (unmodified).
# The PostgreSQL backend (feature `postgres`) adds the synchronous `postgres` client.
[dependencies]
postgres = { version = "0.19", optional = true }
tokio-postgres-rustls = { version = "0.13", optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }
webpki-roots = { version = "1", optional = true }
rustls-pemfile = { version = "2", optional = true }
argon2 = { version = "0.5", optional = true }
sha2 = { version = "0.10", optional = true }
getrandom = { version = "0.3", optional = true }
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"], optional = true }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "query"], optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal"], optional = true }
axum-server = { version = "0.7", default-features = false, features = ["tls-rustls-no-provider"], optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
spectral_hypergraph = { path = "../human_connectome_rnn/crates/spectral_hypergraph", optional = true }
nalgebra = { version = "0.32", default-features = false, features = ["std"], optional = true }
# Pure-CPU non-backtracking machinery only (no Burn): Hashimoto operator and rho_B via krylov_ds.
nbsc = { path = "../human_connectome_rnn/crates/nbsc", default-features = false, optional = true }
human_connectome_rnn = { path = "../human_connectome_rnn", optional = true }

[features]
default = ["spectral", "nonbacktracking", "postgres", "security", "ingest"]
# CSV / JSON-lines / Suricata EVE / Zeek loaders (adds serde_json).
ingest = ["dep:serde_json"]
# PostgreSQL durability + TLS (rustls) for the connection.
postgres = ["crypto", "dep:postgres", "dep:tokio-postgres-rustls", "dep:rustls", "dep:webpki-roots", "dep:rustls-pemfile"]
# Encryption at rest (XChaCha20-Poly1305), HMAC / HKDF, de-identification helpers.
crypto = ["dep:chacha20poly1305", "dep:sha2", "dep:getrandom"]
# Users, passwords (Argon2id), hashed tokens, roles, per-tenant isolation, audit log.
security = ["postgres", "crypto", "dep:argon2"]
# HTTPS API server (`nexgraph-server`).
server = ["security", "dep:axum", "dep:tokio", "dep:axum-server", "dep:serde", "dep:serde_json"]
spectral = ["dep:spectral_hypergraph", "dep:nalgebra"]
nonbacktracking = ["spectral", "dep:nbsc"]
connectome = ["dep:human_connectome_rnn", "spectral"]

[profile.release]
opt-level = 3
codegen-units = 1
lto = true

[[bin]]
name = "nexgraph-deid"
path = "src/bin/nexgraph-deid.rs"
required-features = ["crypto", "ingest"]
