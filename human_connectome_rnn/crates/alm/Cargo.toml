[package]
name = "alm"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Asset-Liability Management: cash-flow projection, EVE / NII under rate shocks, liquidity (LCR + ladder), duration-gap rebalancing, and spectral-hypergraph / Arnoldi contagion diagnostics"
license = "MIT"

[lib]
name = "alm"
path = "src/lib.rs"

[[bin]]
name = "alm"
path = "src/bin/alm.rs"

[dependencies]
krylov_ds = { path = "../krylov_ds" }
spectral_hypergraph = { path = "../spectral_hypergraph" }
nalgebra = "0.32"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
